            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - method_not_allowed
        '408':
          description: The request took longer than 30 s to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - timeout
        '421':
          description: Not a loopback Host on a loopback server
