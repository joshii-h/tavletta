# Copies a Forgejo release to GitHub (GitHub is a push mirror of
# https://git.joshuahirsig.xyz/joshii/tavletta).
#
# Runs when a tag v* arrives through the mirror: creates the GitHub release
# right away with the built-in, repository-scoped GITHUB_TOKEN (no
# long-lived token is involved), before Forgejo has any file, so
# flatpak-bundle.yml can attach its bundle; then copies the Forgejo
# release's notes and files as they arrive, until each workflow that
# attaches files there has attached its checksum file, which it uploads
# last: SHA256SUMS (release.yml), SHA256SUMS-deb (deb.yml), SHA256SUMS-rpm
# (rpm.yml). A file Forgejo has with other content than here (a rebuild) is
# replaced, one that disappears while it is copied (replaced again) is taken
# again in the next pass, and the release notes and title follow Forgejo's,
# to which the workflows add their downloads. After WAIT_MINUTES without all
# the checksum files it fails, naming what is missing; the release and the
# files copied so far stay.
#
# Polling: CrowdSec on the Forgejo host bans an address that asks for
# non-static pages often (scenario crowdsecurity/http-crawl-non_statics),
# API requests and file downloads alike, and then answers 403. The mirror of
# v1.2.0, which asked once a minute, got nothing but 403. So one request for
# the release per pass, a pass every POLL_SECONDS (longer after a 403, up to
# 15 minutes), and each file downloaded once.
#
# Manual run (Actions -> Mirror release from Forgejo -> Run workflow) with a
# tag: copies that release again, once, without waiting; for files attached
# or rebuilt on Forgejo later.
#
# Nothing from the repository is checked out or executed. Forgejo also
# reads .github/workflows, hence the server_url guard.

name: Mirror release from Forgejo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to copy again, e.g. v1.1.2
        required: true

permissions:
  contents: write

jobs:
  mirror:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      FORGEJO_API: https://git.joshuahirsig.xyz/api/v1/repos/joshii/tavletta
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      # each workflow that attaches files uploads its checksum file last
      COMPLETE: SHA256SUMS SHA256SUMS-deb SHA256SUMS-rpm
      # the package builds take up to an hour; a manual run does not wait
      WAIT_MINUTES: ${{ github.event_name == 'push' && '100' || '0' }}
      # between two passes (each one request for the Forgejo release)
      POLL_SECONDS: "180"
    steps:
      - name: Copy the release
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi
          mkdir assets
          touch copied  # the Forgejo asset ids copied (a rebuilt file gets a new one)

          create() {  # the GitHub release, right away: its notes and files follow from Forgejo
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && return
            local pre=()
            case "$TAG" in *-*) pre=(--prerelease) ;; esac
            printf 'Tavletta %s\n\nThe release notes and files follow from %s.\n' \
              "${TAG#v}" "https://git.joshuahirsig.xyz/joshii/tavletta/releases/tag/$TAG" > notes.md
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Tavletta ${TAG#v}" --notes-file notes.md --verify-tag "${pre[@]}"
          }

          fetch() {  # the Forgejo release into $release, one request; $state: ok, none, refused, ...
            local code
            code="$(curl -sS -o forgejo.json -w '%{http_code}' "$FORGEJO_API/releases/tags/$TAG")" || code=000
            case "$code" in
              200) release="$(cat forgejo.json)"; state=ok ;;
              404) state=none ;;
              403|429) state=refused ;;
              *) state="HTTP $code" ;;
            esac
          }

          copy() {  # the files of the Forgejo release not copied yet
            local here id name url digest ours mine
            here="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq '.assets[] | [.name, .id, (.digest // "")] | @tsv')"
            while IFS=$'\t' read -r -u 3 id name url; do
              grep -qxF -- "$id" copied && continue
              case "$name" in ""|*/*|.*|*.) echo "::error::odd asset name: $name"; exit 1 ;; esac
              # flatpak-bundle.yml uploads the bundle here itself: replacing it
              # raced with that workflow (v1.0.1)
              case "$name" in Tavletta-*.flatpak|Tavletta-*.flatpak.sha256) echo "$id" >> copied; continue ;; esac
              # a file replaced on Forgejo meanwhile (a re-run of its workflow) is
              # gone at this address: the next pass takes the new one
              if ! curl -sS --fail -L -o "assets/$name" "$url"; then
                echo "$name: not downloaded, again in the next pass"; failed=1; continue
              fi
              ours="sha256:$(sha256sum "assets/$name" | cut -d' ' -f1)"
              mine="$(awk -F'\t' -v n="$name" '$1 == n { print $2 "\t" $3 }' <<<"$here")"
              if [ -n "$mine" ]; then
                digest="${mine#*$'\t'}"
                if [ -z "$digest" ]; then  # uploaded before GitHub kept digests
                  digest="sha256:$(gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
                    --pattern "$name" --output - | sha256sum | cut -d' ' -f1)"
                fi
                if [ "$digest" = "$ours" ]; then
                  echo "$name exists"; echo "$id" >> copied; continue
                fi
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/${mine%%$'\t'*}"
                echo "$name replaced:"
              fi
              for i in 1 2 3; do  # the GitHub API sometimes answers 500
                gh release upload "$TAG" "assets/$name" -R "$GITHUB_REPOSITORY" && break
                [ "$i" = 3 ] && exit 1
                sleep 20
              done
              # GitHub renames some names; the package workflows choose names it keeps
              if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' |
                   grep -qxF -- "$name"; then
                echo "::error::GitHub renamed $name"; exit 1
              fi
              echo "$name uploaded"; echo "$id" >> copied
            done 3< <(jq -r '.assets[] | [.id, .name, .browser_download_url] | @tsv' <<<"$release")
          }

          notes() {  # the release notes and title as on Forgejo, where workflows add their lines
            local title
            jq -r '.body // ""' <<<"$release" > notes.md
            title="$(jq -r --arg tag "$TAG" '.name // "" | if . == "" then $tag else . end' <<<"$release")"
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)" != \
                 "$(cat notes.md)" ] ||
               [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name -q .name)" != "$title" ]; then
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md > /dev/null
              echo "release notes updated"
            fi
          }

          missing() {  # the checksum files not on the Forgejo release yet
            local f
            for f in $COMPLETE; do
              jq -e --arg n "$f" 'any(.assets[]?; .name == $n)' <<<"$release" > /dev/null || echo "$f"
            done
          }

          give_up() {  # why the copy is not complete; the GitHub release stays as it is
            local again="run this workflow again (Run workflow, tag $TAG)"
            if [ "$state" = refused ]; then
              echo "::error::git.joshuahirsig.xyz refused the requests (403): CrowdSec on the" \
                "Forgejo host has probably banned this runner's address as a crawler. Once" \
                "the ban is over (or lifted), $again."
            elif [ -z "$release" ]; then
              echo "::error::no Forgejo release for $TAG ($state): did release.yml fail? Once it is there, $again."
            elif [ -z "$(missing)" ]; then
              echo "::error::files of the Forgejo release not downloaded (see above): $again."
            else
              echo "::error::not on the Forgejo release yet: $(missing | xargs) (did deb.yml or" \
                "rpm.yml fail?). The GitHub release has the files copied so far; once they are" \
                "there, $again."
            fi
            exit 1
          }

          create
          release="" state="" retries=0 wait="$POLL_SECONDS" start="$SECONDS"
          while :; do
            failed=0
            fetch
            if [ "$state" = ok ]; then
              copy
              notes
              [ -z "$(missing)" ] && [ "$failed" = 0 ] && break
              wait="$POLL_SECONDS"
            elif [ "$state" = refused ]; then
              echo "::warning::git.joshuahirsig.xyz answers 403 (a CrowdSec ban?): asking less often"
              wait=$((wait * 2 > 900 ? 900 : wait * 2))
            else
              echo "Forgejo release: $state"
            fi
            # a download that failed (a file replaced meanwhile): again, also in a manual run
            if [ "$failed" = 1 ] && [ "$retries" -lt 2 ]; then
              retries=$((retries + 1))
            elif [ $((SECONDS - start + wait)) -gt $((WAIT_MINUTES * 60)) ]; then
              give_up
            fi
            sleep "$wait"
          done
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
