# The print server's folders (tavletta-server.service), for the Debian
# package: /usr/lib/tmpfiles.d/tavletta.conf. printers.toml and tokens.toml
# go into /etc/tavletta, the labels into /var/lib/tavletta/labels
# (site/docs/server-install.md).
d /etc/tavletta 0750 tavletta tavletta -
d /var/lib/tavletta 0750 tavletta tavletta -
d /var/lib/tavletta/labels 0750 tavletta tavletta -
