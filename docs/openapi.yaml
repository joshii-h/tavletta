              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - too_many_requests
        '500':
          description: An error of the server (logged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - internal
        '501':
          description: A method HTTP knows but the server does not
        '503':
          description: 'Busy: no request slot, render slot or thread free'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - busy
    delete:
      summary: 'Cancel a job: at once while it waits, after the labels already sent to the printer while
        it prints (cab: the job of up to labels_per_job labels)'
      x-tavletta-role: print
      parameters:
      - *id001
      - *id005
      responses:
        '202':
          description: Canceled, or stopping after the labels already sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Access token missing, wrong, expired or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - unauthorized
        '403':
          description: Not allowed for this token's role, a web page (Origin) not allowed, or X-Tavletta-Request
            missing (no token, a request that contacts printers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - forbidden
          - origin_not_allowed
          - header_required
        '404':
          description: No such job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - job_not_found
        '405':
          description: Not a method of this path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - method_not_allowed
        '408':
          description: The request took longer than 30 s to send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - timeout
        '409':
          description: Already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - job_finished
        '421':
          description: Not a loopback Host on a loopback server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - wrong_host
        '429':
          description: Too many wrong tokens from this address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - too_many_requests
        '500':
          description: An error of the server (logged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - internal
        '501':
          description: A method HTTP knows but the server does not
        '503':
          description: 'Busy: no request slot, render slot or thread free'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - busy
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: 'A token of tokens.toml (tavletta token new) or the one token of --token-file. Ten
        wrong tokens from one address within a minute: 429 for a minute.'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 'Stable, for programs: the same in every language.'
            message:
              type: string
              description: For people, in the language of Accept-Language.
      example:
        error:
          code: label_not_found
          message: 'No such label: x'
    Warning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          examples:
          - barcode_narrow
          - font_missing
          - other_labels_loaded
        message:
          type: string
    Health:
      type: object
      required:
      - status
      - version
      properties:
        status:
          const: ok
        version:
          type: string
      example:
        status: ok
        version: 1.2.1
    NamedPrinter:
      type: object
      description: A printer of printers.toml.
      required:
      - name
      - printer
      - host
      properties:
        name:
          type: string
          description: What requests name in 'printer'.
        printer:
          type: string
          description: Printer model id.
        model:
          type: string
          description: Printer model, for people.
        host:
          type: string
        description:
          type:
          - string
          - 'null'
        location:
          type:
          - string
          - 'null'
        media:
          type:
          - string
          - 'null'
        default:
          type: boolean
        max_copies:
          type: integer
        status:
          description: The state (as PrinterStatus), or state UNREACHABLE with an error; null with status=false.
          type:
          - object
          - 'null'
    Printer:
      type: object
      description: A printer model (without printers.toml).
      required:
      - id
      - name
      - kind
      - found
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          enum:
          - tape
          - labels
          - pages
        dpi:
          type: number
        color_model:
          enum:
          - color
          - mono
          - two-color
        tape_widths_mm:
          type: array
          items:
            type: number
        label_sizes_mm:
          type: array
          items:
            type: array
            items:
              type: number
        configured_host:
          type:
          - string
          - 'null'
        found:
          type: array
          description: Printers found on the network (--discover).
          items:
            type: object
            properties:
              name:
                type: string
              host:
                type: string
              address:
                type: string
    PrinterStatus:
      type: object
      required:
      - printer
      - host
      - state
      properties:
        printer:
          type: string
        host:
          type: string
        name:
          type: string
          description: Its name in printers.toml.
        model:
          type: string
        state:
          type: string
          examples:
          - IDLE
          - PRINTING
          - ERROR
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Warning'
        dpi:
          type: number
        firmware:
          type:
          - string
          - 'null'
        modes:
          type: array
          items:
            type: string
        media:
          type: object
          description: 'What is loaded and how the printer is set up, as far as it tells (null: not told):
            tape_mm, remaining_mm, total_mm, pitch_mm (die-cut labels: the label distance measured),
            width_mm (the print width set on a ZPL printer: a setting, not the loaded labels), print_method
            (direct or transfer, as set on the printer), media_type (gap, mark or continuous: how the
            printer is set to find the labels), cassette. Not told by the printer but from the server''s
            settings for it: job_print_method and job_media_type, what this server''s jobs do.'
          properties:
            tape_mm:
              type:
              - number
              - 'null'
            remaining_mm:
              type:
              - integer
              - 'null'
            total_mm:
              type:
              - integer
              - 'null'
            pitch_mm:
              type:
              - number
              - 'null'
              description: 'Die-cut labels: the distance from one label to the next, as the printer measured
                it.'
            label_mm:
              type:
              - array
              - 'null'
              items:
                type: number
              description: 'Die-cut labels: the size of the labels loaded (width, height), if the printer
                tells it.'
            width_mm:
              type:
              - number
              - 'null'
              description: 'The print width set on the printer (ZPL): a setting, which each Tavletta
                job sets too, not the width of the loaded labels.'
            print_method:
              type:
              - string
              - 'null'
              enum:
              - direct
              - transfer
              - null
              description: 'Thermal printers: the print method set on the printer, direct (thermal direct)
                or transfer (with a ribbon). A job may print with another one: see job_print_method.'
            job_print_method:
              type:
              - string
              - 'null'
              enum:
              - direct
              - transfer
              - null
              description: 'Thermal printers: the print method this server''s jobs print with. The printer''s
                settings (method in printers.toml, else the app''s) may set it for each job (cab), else
                it is the one set on the printer (print_method; ZPL always). null: unknown.'
            media_type:
              type:
              - string
              - 'null'
              enum:
              - gap
              - mark
              - continuous
              - null
              description: 'Die-cut printers: how the printer is set to find the labels (ZPL), gap between
                labels, black mark or continuous media. A job may find them otherwise: see job_media_type.'
            job_media_type:
              type:
              - string
              - 'null'
              enum:
              - gap
              - mark
              - continuous
              - transparent
              - null
              description: 'Die-cut printers: how this server''s jobs find the labels. The printer''s
                settings (media in printers.toml, else the app''s) may set it for each job (ZPL ^MN,
                TSPL, EPL2, NIIMBOT), else it is the one set on the printer (media_type). When it is
                not media_type, what the printer reports of the loaded labels is not for these jobs:
                no other_labels_loaded. null: unknown.'
            cassette:
              type:
              - object
              - 'null'
    LabelFile:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          examples:
          - asset-tag.tavletta
        bytes:
          type: integer
        modified:
          type: string
          format: date-time
    Label:
      type: object
      required:
      - name
      - printer
      - elements
      properties:
        name:
          type: string
        printer:
          type: object
          description: Model id and name.
        size:
          type: object
          description: Tape, length, orientation, mm.
        elements:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              kind:
                type: string
                examples:
                - text
                - code
                - image
              name:
                type:
                - string
                - 'null'
                description: What 'set' fills in.
              text:
                type: string
              data:
                type: string
              symbology:
                type: string
              file:
                type:
                - string
                - 'null'
        variables:
          type: array
          items:
            type: string
          description: 'Variables of your own, {=lot}: filled in with ''set''.'
        builtin_variables:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
          description: 'Placeholders {Column}: the keys of data_rows.'
        data_file:
          type:
          - string
          - 'null'
        data_file_unusable:
          type: boolean
        data_file_missing:
          type: boolean
          description: 'data_file is not there (any more): send the rows in data_rows.'
        data_sheet:
          type:
          - string
          - 'null'
        counter:
          type: object
          description: used (the label has {=counter}), next, step.
        features:
          type: array
          items:
            type: string
        on_sheet:
          type: boolean
          description: 'Printed on label sheets: at most 999 labels in one job.'
    PreviewRequest:
      type: object
      additionalProperties: false
      properties:
        label: &id007
          type: string
          maxLength: 1024
          description: Name of a label file in the labels folder (see GET /labels), subfolders with '/';
            '.tavletta' may be left out. Either label or label_content.
          examples:
          - asset-tag
        label_content: &id008
          type: object
          description: Or the label itself, as the JSON of a .tavletta file, checked like a file that
            is opened. Its data file is ignored (send data_rows instead), its counter never saved.
        printer: &id009
          type: string
          description: 'With printers.toml on the server: the printer''s name (default: the default printer
            the token may use, or the only one). Without it: a printer model id, if not the label''s
            own (the label is fitted as in the app).'
          examples:
          - it-cab
        set: &id010
          type: object
          maxProperties: 1000
          additionalProperties: &id006
            type:
            - string
            - number
            - 'null'
          description: Element name or variable name -> value, as --set on the command line; variables
            in a value are filled in; 'date' sets the moment {=date} and {=time} start from (ISO 8601).
            At most 1000 entries.
          examples:
          - title: Flour
            lot: A-17
        set_literal: &id011
          type: object
          maxProperties: 1000
          additionalProperties: *id006
          description: Like set, but braces in a value are text, not variables.
        counter_start: &id012
          type: integer
          minimum: 0
          maximum: 999999999999999
          description: The {=counter} of the first label; it goes up by the label's step with every label,
            copy and row.
        data_rows: &id013
          type: array
          minItems: 1
          maxItems: 100000
          items:
            type: object
            maxProperties: 1000
            additionalProperties:
              type:
              - string
              - number
              - 'null'
          description: 'Serial labels: one label per row, column name -> value; the label''s {Column}
            placeholders take the values. Numbers are taken as text, null as an empty cell. At most 100000
            rows, 1000 columns, 2000000 cells, 100000 characters a value.'
          examples:
          - - AssetNumber: '100001'
        data_file: &id014
          type: string
          description: Or a CSV, TSV, ODS or XLSX file in the labels folder. Without data_rows and data_file,
            the label's own data file is used if it lies beside the label in the labels folder.
        sheet: &id015
          type: string
          description: Sheet of the data file, the first by default.
        row:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
          description: Data row to show, from 1.
        format:
          enum:
          - png
          - json
          default: png
          description: '''json'': width, height, warnings and the PNG in base64.'
        view:
          enum:
          - preview
          - printer
          default: preview
          description: '''printer'': the image as the printer gets it (turned, in its colours).'
    Preview:
      type: object
      required:
      - width
      - height
      - warnings
      - png
      properties:
        width:
          type: integer
        height:
          type: integer
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: 'What would print wrongly. other_labels_loaded: the printer of printers.toml reports
            other labels loaded than the label''s (their size, or the label distance it measured). Its
            latest answer counts if it is of the last minute, an error as nothing known (asked anew in
            the background); a printer not known yet is waited for up to a second after the label is
            rendered.'
        png:
          type: string
          contentEncoding: base64
        geometry:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Geometry'
          description: Where the elements are in the image; null for view=printer and a label turned
            onto its sheet.
    Geometry:
      type: object
      description: The elements' boxes in the preview image, in mm from its top left corner (tavletta/editing.py,
        docs/editing.md); a pixel of the image is mm * dpi / 25.4.
      required:
      - width_mm
      - height_mm
      - layout
      - elements
      - dpi
      properties:
        width_mm:
          type: number
          description: 'Along the tape: the length.'
        height_mm:
          type: number
          description: 'Across: tape or label height.'
        layout:
          enum:
          - flow
          - free
        dpi:
          type: number
          description: The image's resolution.
        elements:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                description: From 0, in the order of the label's elements (GET /labels/{name} counts
                  them from 1).
              kind:
                type: string
              box:
                type: array
                items:
                  type: number
                minItems: 4
                maxItems: 4
                description: 'left, top, right, bottom in mm: its ink.'
              rotation:
                type: integer
      example:
        width_mm: 40.0
        height_mm: 18.6
        layout: free
        dpi: 300.0
        elements:
        - index: 0
          kind: text
          box:
          - 2.0
          - 1.5
          - 21.83
          - 6.2
          rotation: 0
    Me:
      type: object
      required:
      - name
      - role
      - token_required
      - limits
      properties:
        name:
          type: string
          description: The token's name in tokens.toml; 'token' for the one token of --token-file, 'local'
            without a token; 'oidc:<user>' for someone signed in to the web page with OpenID Connect.
        display_name:
          type: string
          description: A person's name from the provider; else the same as name.
        session:
          type: boolean
          description: 'true: signed in to the web page with OpenID Connect (its session cookie), not
            with a token.'
        role:
          enum:
          - preview
          - print
          - admin
        printers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: 'The printers the token may use; null: all.'
        token_required:
          type: boolean
          description: 'false: the server has no token and no --oidc (loopback only).'
        limits:
          type: object
          description: 'What one request may ask for at most: labels in one job (--max-labels; on label
            sheets at most 999), copies, data rows, columns and cells, and the body in bytes (--max-body;
            also the largest label file to upload).'
          properties:
            max_labels:
              type: integer
            max_sheet_labels:
              type: integer
            max_copies:
              type: integer
            max_rows:
              type: integer
            max_columns:
              type: integer
            max_cells:
              type: integer
            max_body:
              type: integer
      example:
        name: shipping-terminal
        role: print
        printers:
        - it-cab
        token_required: true
        limits:
          max_labels: 10000
          max_sheet_labels: 999
          max_copies: 9999
          max_rows: 100000
          max_columns: 1000
          max_cells: 2000000
          max_body: 4194304
    DataRequest:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          contentEncoding: base64
          description: 'The file: CSV (any delimiter, UTF-8, UTF-16 or Windows-1252), ODS or XLSX, told
            apart by content. Pasted text is a CSV file.'
        name:
          type: string
          maxLength: 255
          description: The file's name, for messages.
        sheet:
          type: string
          description: 'ODS, XLSX: the sheet (default the first).'
        header:
          type: boolean
          default: true
          description: 'false: the first row is data too; the columns are named A, B, C …'
    Data:
      type: object
      required:
      - kind
      - columns
      - rows
      properties:
        kind:
          enum:
          - csv
          - ods
          - xlsx
        delimiter:
          type:
          - string
          - 'null'
          description: 'CSV: the delimiter found; null for one column and spreadsheets.'
        sheets:
          type: array
          items:
            type: string
        sheet:
          type:
          - string
          - 'null'
          description: The sheet read.
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: 'Every cell as the text it shows: leading zeros and number formats kept (00300
            stays 00300). Rows without a filled cell are left out.'
      example:
        kind: csv
        delimiter: ;
        sheets: []
        sheet: null
        columns:
        - AssetNumber
        - Room
        rows:
        - AssetNumber: '00300'
          Room: B 2.14
    PrintRequest:
      type: object
      additionalProperties: false
      properties:
        label: *id007
        label_content: *id008
        printer: *id009
        set: *id010
        set_literal: *id011
        counter_start: *id012
        data_rows: *id013
        data_file: *id014
        sheet: *id015
        host:
          type: string
          maxLength: 512
          description: 'Printer address, only without printers.toml (default: the one set in the app,
            else with --discover the only printer found). Refused (host_given) with printers.toml.'
        copies:
          type: integer
          minimum: 1
          maximum: 9999
          default: 1
          description: 'Copies of each label (each row); at most the printer''s max_copies. Copies times
            rows: at most --max-labels (10000 by default), on label sheets at most 999.'
        rows:
          type: string
          maxLength: 50
          description: 'The data rows to print, from 1: ''3-10'', ''5'', ''7-'' (to the last) or ''-4''.
            To print again from where a job stopped.'
          examples:
          - 14-20
        no_save_counter:
          type: boolean
          default: false
          description: Do not save the next {=counter} value into the label file.
        wait:
          type: number
          minimum: 0
          maximum: 300.0
          default: 0
          description: 'Seconds to wait for the job to finish before answering: 200 if it did, else 202.'
    Job:
      type: object
      required:
      - id
      - state
      - printed
      - total
      properties:
        id:
          type: string
          description: Random, 16 characters.
        state:
          enum:
          - queued
          - waiting
          - printing
          - done
          - failed
          - canceled
          description: 'waiting: its turn came, another job holds the label file (its counter). done,
            failed and canceled are final.'
        printer:
          type: string
          description: Printer model id.
        printer_name:
          type:
          - string
          - 'null'
          description: Its name in printers.toml.
        host:
          type: string
          description: The printer's address.
        owner:
          type:
          - string
          - 'null'
          description: Name of the token.
        label:
          type:
          - string
          - 'null'
          description: Name in the labels folder; null for label_content.
        printed:
          type: integer
          description: Labels printed so far, for certain; rises label by label while the job prints,
            as far as the printer tells.
        printed_max:
          type:
          - integer
          - 'null'
          description: 'After a failure whose outcome the printer could not tell (the connection was
            lost while it printed): up to this many labels may have printed. The counter goes on after
            them; rows_printed counts the rows printed for certain, so printing again from the next one
            may print labels twice. null otherwise.'
        total:
          type: integer
          description: 'Labels to print: copies x rows.'
        rows_printed:
          type: integer
          description: 'Data rows printed in full: after a failure, print again with rows set to the
            next one (rows_printed + first row).'
        cancel_requested:
          type: boolean
          description: DELETE was sent.
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Warning'
          description: 'Why it failed: printer_<code>, counter_not_saved, label_locked or prepare_failed.'
        remark:
          type:
          - string
          - 'null'
          description: A note of the printer, for people.
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
          description: 'Found when it was checked; it printed anyway. other_labels_loaded: the printer
            reports other labels loaded than the label''s (their size, or the label distance it measured);
            for a printer of printers.toml as in a preview when the job is queued, and replaced by what
            the printer reports when the job prints, if it then tells of the loaded labels.'
        created:
          type: string
          format: date-time
          description: UTC.
        started:
          type:
          - string
          - 'null'
          format: date-time
        finished:
          type:
          - string
          - 'null'
          format: date-time
      example:
        id: HxIwYqXuV4qYRBM7
        state: done
        printer: cab
        printer_name: it-cab
        host: cab-it.example.com
        owner: inventory-tool
        label: asset-tag.tavletta
        printed: 20
        printed_max: null
        total: 20
        rows_printed: 20
        cancel_requested: false
        error: null
        remark: null
        warnings: []
        created: '2026-11-12T15:34:45+00:00'
        started: '2026-11-12T15:34:45+00:00'
        finished: '2026-11-12T15:35:04+00:00'
