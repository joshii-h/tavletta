# Builds the RPMs for a tag v* in a Fedora container and attaches them to
# the Forgejo release: tavletta (noarch) and the Python packages it needs
# that Fedora does not have (python3-segno, python3-barcode,
# python3-labelprinter, python3-zint-bindings), each with its SRPM, and
# SHA256SUMS-rpm. The specs follow Fedora's packaging guidelines
# (packaging/rpm/, built by packaging/rpm/build.sh, checked by rpmlint).
#
# The packages are installed in the same container and tried before the
# upload: `tavletta --version` must print the tag's version, and a label is
# rendered to PNG without a printer or display.
#
# The release itself comes from release.yml; this workflow waits for it.
# GitHub copies the assets (release-mirror.yml).
#
# Manual run (Actions -> RPM -> Run workflow): builds and tries the packages
# of the selected branch, or of `tag` if given; uploads nothing.
#
# No secrets: Forgejo uses the automatic Actions token.
# Re-runs are safe: existing assets are skipped.

name: RPM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v1.1.0 (empty = the selected branch); nothing is uploaded
        required: false
        default: ""

permissions:
  contents: write

env:
  FORGEJO_URL: https://git.joshuahirsig.xyz
  REPO_URL: https://git.joshuahirsig.xyz/${{ github.repository }}.git

defaults:
  run:
    shell: bash

jobs:
  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - name: Install git
        run: dnf install -y -q git-core jq > /dev/null

      - name: Get the code
        run: |
          set -euo pipefail
          git clone -q "$REPO_URL" src
          cd src
          if [ -n "$TAG" ]; then
            # strict: the tag is used in URLs and API paths
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
              echo "::error::not a release tag: $TAG"; exit 1
            fi
            git checkout -q --detach "refs/tags/$TAG"
          else
            git checkout -q --detach "$GITHUB_SHA"
          fi
          git log -1 --format='%h %s'
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' tavletta/__init__.py)"
          if [ -n "$TAG" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version $version in tavletta/__init__.py"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        working-directory: src
        run: |
          set -euo pipefail
          # a tag: the source as Forgejo serves it (the spec's Source),
          # otherwise the checked out commit
          if [ -n "$TAG" ]; then
            curl -sS --fail -L -o ../tavletta.tar.gz "$FORGEJO_URL/$GITHUB_REPOSITORY/archive/$TAG.tar.gz"
            packaging/rpm/build.sh ../rpms ../tavletta.tar.gz
          else
            packaging/rpm/build.sh ../rpms
          fi

      - name: Try the packages
        working-directory: rpms
        run: |
          set -euo pipefail
          dnf install -y -q $(ls *.rpm | grep -v '\.src\.rpm$')
          out="$(tavletta --version)"
          echo "$out"
          grep -qF "$VERSION" <<<"$out" || { echo "::error::expected $VERSION"; exit 1; }
          # a label rendered to PNG: no printer, no display
          tavletta print ../src/docs/examples/cable.tavletta --printer vc500w \
            --no-query --no-save-counter --dry-run --output cable.png
          python3 -c 'from PIL import Image; im = Image.open("cable.png"); print(im.size); assert min(im.size) > 0'
          rm cable.png
          sha256sum -- *.rpm > SHA256SUMS-rpm
          ls -l; cat SHA256SUMS-rpm

      - name: Attach to the Forgejo release
        if: env.PUBLISH == 'true'
        working-directory: rpms
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$FORGEJO_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: token $TOKEN")
          # release.yml creates the release; wait for it (up to 30 minutes),
          # once a minute: frequent polling looks like a crawler to the server's CrowdSec
          for i in $(seq 30); do
            release="$(curl -sS --fail "${auth[@]}" "$api/releases/tags/$TAG")" && break
            [ "$i" = 30 ] && { echo "::error::no Forgejo release for $TAG"; exit 1; }
            sleep 60
          done
          id="$(jq -r .id <<<"$release")"
          for f in *.rpm SHA256SUMS-rpm; do
            if jq -e --arg n "$f" 'any(.assets[]?; .name == $n)' <<<"$release" > /dev/null; then
              echo "$f exists"; continue
            fi
            curl -sS --fail-with-body "${auth[@]}" -F "attachment=@$f" \
              "$api/releases/$id/assets?name=$(jq -rn --arg n "$f" '$n|@uri')" > /dev/null
            echo "$f uploaded"
          done
          echo "$FORGEJO_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
