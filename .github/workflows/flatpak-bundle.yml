# Builds a single-file Flatpak bundle for each release tag and attaches it to
# the GitHub release and to the Forgejo release (main repository), and names
# it in both releases' notes.
#
# Runs on GitHub because Flatpak builds need a privileged container; the
# Forgejo runner deliberately has none. Only maintainers can push tags v*,
# so the code built here is trusted. The Forgejo upload uses FORGEJO_TOKEN of
# the tavletta-bot user (write access to joshii/tavletta only).
#
# Forgejo also reads .github/workflows, hence the server_url guard.
#
# CrowdSec on the Forgejo host bans an address that asks for non-static
# pages often (scenario crowdsecurity/http-crawl-non_statics) and then
# answers 403: the steps that wait for the Forgejo release ask every 3
# minutes (see release-mirror.yml). tests/test_packaging.py runs the waits
# with fake curl and gh.

name: Flatpak bundle

on:
  push:
    tags: ["v*"]
  # test run: builds the bundle and keeps it as a workflow artifact, uploads nothing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    # the build (about 10 minutes), the waits below at most 10 + 15 + 9 and the
    # notes' checks: an ::error:: names what is missing well before this
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'test' }}
      APP_ID: xyz.joshuahirsig.Tavletta
    steps:
      - name: Check the tag
        if: github.event_name == 'push'
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::not a release tag: $TAG"; exit 1
          fi

      - name: Tools for the upload steps
        run: |
          # the build image is Fedora based; gh and jq are not always included
          command -v gh > /dev/null && command -v jq > /dev/null ||
            dnf install -y -q gh jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3  # v6.8
        with:
          manifest-path: build-aux/flatpak/xyz.joshuahirsig.Tavletta.yml
          bundle: Tavletta-${{ github.event_name == 'push' && github.ref_name || 'test' }}-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: ${{ github.event_name != 'push' }}

      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="Tavletta-$TAG-x86_64.flatpak"
          sha256sum "$bundle" > "$bundle.sha256"
          # release-mirror.yml creates the release as soon as the tag arrives, before
          # Forgejo's files (GitHub's API: no CrowdSec there)
          for i in $(seq 20); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            [ "$i" = 20 ] && { echo "::error::no GitHub release for $TAG: did release-mirror.yml fail?"; exit 1; }
            sleep 30
          done
          gh release upload "$TAG" "$bundle" "$bundle.sha256" --clobber -R "$GITHUB_REPOSITORY"

      - name: Attach to the Forgejo release
        if: github.event_name == 'push'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_API: https://git.joshuahirsig.xyz/api/v1/repos/joshii/tavletta
        run: |
          set -euo pipefail
          bundle="Tavletta-$TAG-x86_64.flatpak"
          auth=(-H "Authorization: token $FORGEJO_TOKEN")
          # release.yml creates it within minutes of the tag: asked every 3
          # minutes, 6 times (not a page in between: JSON with an id)
          for i in $(seq 6); do
            code="$(curl -sS --connect-timeout 20 --max-time 60 "${auth[@]}" -o release.json \
              -w '%{http_code}' "$FORGEJO_API/releases/tags/$TAG")" || code=000
            [ "$code" = 200 ] && jq -e .id release.json > /dev/null 2>&1 && break
            if [ "$code" = 403 ] || [ "$code" = 429 ]; then
              echo "::warning::git.joshuahirsig.xyz answers $code: CrowdSec may have banned this runner's address"
            fi
            [ "$i" = 6 ] && { echo "::error::no Forgejo release for $TAG (HTTP $code)"; exit 1; }
            sleep 180
          done
          release="$(cat release.json)"
          id="$(jq -r .id <<<"$release")"
          for f in "$bundle" "$bundle.sha256"; do
            if jq -e --arg n "$f" 'any(.assets[]?; .name == $n)' <<<"$release" > /dev/null; then
              echo "$f exists"; continue
            fi
            curl -sS --fail-with-body --connect-timeout 20 --max-time 600 "${auth[@]}" -F "attachment=@$f" \
              "$FORGEJO_API/releases/$id/assets?name=$(jq -rn --arg n "$f" '$n|@uri')" > /dev/null
            echo "$f uploaded"
          done

      - name: Name the bundle in the release notes
        if: github.event_name == 'push'
        env:
          FORGEJO_URL: https://git.joshuahirsig.xyz
          FORGEJO_REPOSITORY: joshii/tavletta
          TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # release-assets.sh's wait for the Forgejo release (there by now, the
          # step before attached to it): every 3 minutes, 3 times
          RELEASE_WAIT_SECONDS: "180"
          RELEASE_WAIT_TRIES: "3"
        run: |
          set -euo pipefail
          line="- Any Linux distribution with Flatpak, x86-64: \`Tavletta-$TAG-x86_64.flatpak\`; checksum in \`.sha256\`"
          # Forgejo's notes, which release-mirror.yml copies here, then this
          # release's own, so the line is here also when the mirror has finished
          GITHUB_REPOSITORY="$FORGEJO_REPOSITORY" packaging/release-assets.sh notes "$TAG" "$line"
          # release-mirror.yml may write the notes at the same moment and drop the
          # line again: checked again after 30 seconds, added again if missing
          checked=0
          for i in 1 2 3 4; do
            body="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body)"
            if grep -qxF -- "$line" <<<"$body"; then
              [ "$checked" = 1 ] && { echo "release notes: $line"; exit 0; }
              checked=1
              sleep 30
              continue
            fi
            grep -qxF -- "**Downloads**" <<<"$body" || body="${body%$'\n'}"$'\n\n'"**Downloads**"$'\n\n'
            printf '%s\n%s\n' "${body%$'\n'}" "$line" > notes.md
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md > /dev/null
            checked=0
          done
          echo "::error::the GitHub release notes of $TAG keep losing: $line"
          exit 1
