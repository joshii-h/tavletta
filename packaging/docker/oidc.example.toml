# oidc.toml: people sign in to the web page with OpenID Connect
# (docs/server.md, site/docs/server-install.md#oidc). Programs keep using
# tokens (tokens.toml). Start the server with --oidc /config/oidc.toml.
#
# At the provider: a confidential client, authorization code flow only,
# PKCE S256, redirect URI <public_url>/oidc/callback, post-logout redirect
# URI <public_url>/. The roles must reach the ID token (Keycloak: a "User
# Client Role" mapper on the client with "Add to ID token"; Authentik sends
# "groups").

[oidc]
issuer = "https://id.example.com/realms/example"   # exactly as the provider names itself
client_id = "tavletta"
client_secret_file = "/config/oidc-secret"         # the secret alone, mode 600
public_url = "https://labels.example.com"          # the address people open
provider_name = "Example ID"                       # "Sign in with Example ID"
roles_claim = "resource_access.tavletta.roles"     # Keycloak client roles
# roles_claim = "realm_access.roles"               # Keycloak realm roles
# roles_claim = "groups"                           # Authentik, Entra ID groups
# session_hours = 8                                # a session at most
# idle_minutes = 60                                # without use
# token_login = false                              # hide the token field

# Which of the provider's roles (or groups) give which Tavletta role.
# Someone with none of them gets "no access".
[oidc.roles]
preview = ["tavletta-preview"]
print = ["tavletta-print"]
admin = ["tavletta-admin"]

# Optional: printers per provider role (keys as in [oidc.roles], values
# printer names from printers.toml, "*" for all); without, every printer.
# [oidc.printers]
# "tavletta-print" = ["shipping"]
