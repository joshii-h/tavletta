# Builds the Debian packages for a tag v* and attaches them to the Forgejo
# release that release.yml creates. GitHub copies them with the rest
# (.github/workflows/release-mirror.yml).
#
# packaging/debian/build.sh builds, in a debian:trixie container, tavletta
# and the two packages it needs that Debian does not have
# (python3-zint-bindings, against Debian's libzint, and python3-labelprinter,
# the fork's pinned commit), with lintian on each; smoke-test.sh installs them
# and renders example labels without a display. Assets: every .deb and
# SHA256SUMS-deb.
#
# Manual run (Actions -> Debian packages -> Run workflow): `tag` empty builds
# and tests the selected branch and uploads nothing; a tag rebuilds that
# release and adds missing files to it (existing assets are skipped).
#
# No secrets: Forgejo uses the automatic Actions token.

name: Debian packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach, e.g. v1.1.0 (empty = test build, uploads nothing)
        required: false
        default: ""

permissions:
  contents: write

env:
  FORGEJO_URL: https://git.joshuahirsig.xyz
  REPO_URL: https://git.joshuahirsig.xyz/${{ github.repository }}.git
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    shell: bash

jobs:
  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Install system packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git curl jq > /dev/null

      - name: Get the code
        run: |
          set -euo pipefail
          git clone -q "$REPO_URL" src
          cd src
          if [ -n "$TAG" ]; then
            # strict: the tag is used in URLs and API paths
            if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$'; then
              echo "::error::not a release tag: $TAG"; exit 1
            fi
            git checkout -q --detach "refs/tags/$TAG"
            version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' tavletta/__init__.py)"
            if [ "$TAG" != "v$version" ]; then
              echo "::error::tag $TAG does not match the version $version in tavletta/__init__.py"; exit 1
            fi
            echo "PUBLISH=true" >> "$GITHUB_ENV"
          else
            echo "::notice::test build of ${GITHUB_SHA}, nothing is uploaded"
            git checkout -q --detach "$GITHUB_SHA"
            version="$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' tavletta/__init__.py)"
            echo "PUBLISH=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          git log -1 --format='%h %s'

      - name: Build
        run: src/packaging/debian/build.sh out

      - name: Install and try
        run: src/packaging/debian/smoke-test.sh out "$VERSION"

      - name: Checksums
        working-directory: out
        run: |
          sha256sum -- *.deb > SHA256SUMS-deb
          ls -l; cat SHA256SUMS-deb

      - name: Attach to the Forgejo release
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$FORGEJO_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: token $TOKEN")
          # the release is created by release.yml, which may still be building;
          # once a minute: frequent polling looks like a crawler to the server's CrowdSec
          for i in $(seq 30); do
            release="$(curl -sS --fail "${auth[@]}" "$api/releases/tags/$TAG")" && break
            [ "$i" = 30 ] && { echo "::error::no Forgejo release for $TAG"; exit 1; }
            sleep 60
          done
          id="$(jq -r .id <<<"$release")"
          for f in out/*.deb out/SHA256SUMS-deb; do
            name="$(basename "$f")"
            if jq -e --arg n "$name" 'any(.assets[]?; .name == $n)' <<<"$release" > /dev/null; then
              echo "$name exists"; continue
            fi
            curl -sS --fail-with-body "${auth[@]}" -F "attachment=@$f" \
              "$api/releases/$id/assets?name=$(jq -rn --arg n "$name" '$n|@uri')" > /dev/null
            echo "$name uploaded"
          done
          echo "$FORGEJO_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
