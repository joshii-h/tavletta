        in: header
        required: false
        schema:
          type: string
        description: Language of the messages, e.g. de-CH; English by default.
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          description: Not allowed for this token's role, a web page (Origin) not allowed, or X-Tavletta-Request
            missing (no token, a request that contacts printers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          x-tavletta-codes:
          - forbidden
          - origin_not_allowed
          - header_required
        '405':
          description: Not a method of this path
